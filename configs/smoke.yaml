project:
  name: smoke-dinov2
  family: nanopath
  recipe_id: dinov2-vits14-reg-jepa-mask10
  output_dir: /data/$USER/nanopath/main/smoke
  wandb_dir: /data/$USER/nanopath/wandb

data:
  # dataset_dir holds the parquet shards (shard-NNNNN.parquet) that train.py reads.
  # `prepare.py … download=True` populates it from the medarc/nanopath HF mirror.
  dataset_dir: /data/nanopath_parquet
  split_seed: 42
  val_fraction: 0.05
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  global_crop_scale: [0.4, 1.0]
  local_crop_scale: [0.08, 0.35]
  color_jitter: 0.3
  color_jitter_saturation: 0.25
  hed_jitter: 0.06
  tissue_thresh: 0.0 # 0 disables tissue rejection; >0 requires this saturated-pixel fraction

model:
  type: dinov2_vits14_reg
  qkv_blocks: 4 # blocks (from the input side) that get a [CLS]-specialized qkv projection; LayerNorms and LayerScales are specialized in all blocks. Registers stay on the patch weights
  probe_layers: [4, 6, 8, 11] # blocks whose CLS probe_features concatenates (0-based); rides in the checkpoint

train:
  seed: 1337
  bf16: true
  activation_checkpointing: false
  batch_size: 128
  num_workers: 16
  prefetch_factor: 2
  persistent_workers: true
  max_train_samples: 1000000 # full-run sample cap; smoke normally reaches max_train_flops first
  max_train_flops: 5000000000000000 # 5.0e15 — short enough to finish in a few minutes
  log_every: 5
  # Smoke leaves no persistent checkpoints; final probes still use a temporary checkpoint.
  save_every: null
  eval_every: 50
  val_batches: 4
  global_views: 2
  local_views: 4 # real multi-crop: 112px resampled crops, the magnification that context_regions cannot give
  context_regions: # [[side, count], ...]: `count` context regions of `side` patches per global view
  - [12, 1] # near-complete view (56% of the 16x16 grid) -- keeps a global-to-global DINO term
  - [8, 1] # small view (25%) -- the local-to-global term
  global_size: 224
  local_size: 112
  resume: null # optional explicit checkpoint path; null means always start fresh and wipe output_dir

dino:
  lr: 1.0e-4
  lr_min: 1.0e-6
  lr_ref_batch_size: 128 # lr and lr_min scale linearly by batch_size / this; null disables
  adam_beta2: 0.999
  warmup_fraction: 0.0909
  freeze_last_layer_fraction: 0.0091
  layerwise_decay: 0.7
  cls_lr_mult: 1.0 # CLS-specialized (.cls.) params bypass layer-wise decay; new capacity, not pretrained features
  patch_embed_lr_mult: 0.2
  drop_path_rate: 0.1
  head_hidden_dim: 2048
  head_bottleneck_dim: 384 # split evenly across head_factors, so it must divide by it
  head_factors: 1 # codebooks the bottleneck is cut into; 1 = the original single-head behaviour
  head_prototypes: 131072 # TOTAL across factors; each factor gets this // head_factors, and the joint code space is that quotient ** head_factors
  prototype_reg: # keys other than `kind` are the regularizer's constructor arguments
    kind: none # none | coding_rate | swd
    weight: 0.0
    # coding_rate: eps
    # swd: projections, scale_weight, shape_weight, center_weight
  cls_vis_reg: # VISReg on a FIFO queue of CLS embeddings; keys are QueuedVISReg's constructor arguments
    weight: 0.0 # 0 disables, and the queue is not even allocated
    queue_size: 4096 # total samples the statistic sees = queue_size + batch_size
    num_projections: 256
    scale_weight: 1.0
    shape_weight: 1.0
    center_weight: 1.0
  align_from_layer: null # null disables; N aligns student/teacher CLS from block N to the last (0-based)
  align_weight: 0.0 # cross-view 2-2cos alignment on those CLS tokens; raw term is ~2 at zero agreement
  clip_grad: 3.0
  kde_loss_weight: 0.005
  kde_concentration: 10.0
  jepa_pred_depth: 4
  jepa_pred_width: 0
  jepa_targets: 80 # patches sampled without replacement from outside the context; cap is 112 (256 - 12^2)
  jepa_target_decay: 0.0 # e-folds of preference across the available depth: 0 uniform, >0 hugs the context, <0 goes deep
  jepa_target_decay_end: 0.0
  student_view_jitter: 0.0 # HED sigma re-applied to the student region view only; 0 disables. Teacher stays as collated # cosine target over reg_frac; equal to the start = no curriculum. e.g. 2.0 -> -1.0 anneals near to deep

probe:
  enabled: true
  model_weights: ema
  count: 1 # 4 means probing at 25%, 50%, 75%, and 100% of the sample cap. 1 means probing just at the end.
  datasets:
    - bach
    - bracs
    - break_his
    - crc
    - esca
    - mhist
    - pcam
    - spider_breast
    - spider_colorectal
    - spider_skin
    - spider_thorax
    - wilds
  segmentation_datasets:
    - pannuke
    - segpath_epithelial
    - segpath_lymphocytes
  slide_datasets:
    - ucla_lung
  auc_datasets:
    - surgen
  survival_datasets:
    - leopard_bcr
    - cptac_pda_os
  robustness_datasets:
    - pathorob
  dataset_roots:
    bach: /data/thunder-data/bach
    bracs: /data/thunder-data/bracs
    break_his: /data/thunder-data/break_his
    crc: /data/thunder-data/crc
    esca: /data/thunder-data/esca
    mhist: /data/thunder-data/mhist
    pcam: /data/thunder-data/patch_camelyon
    spider_breast: /data/thunder-data/spider_breast
    spider_colorectal: /data/thunder-data/spider_colorectal
    spider_skin: /data/thunder-data/spider_skin
    spider_thorax: /data/thunder-data/spider_thorax
    wilds: /data/thunder-data/wilds
    pannuke: /data/thunder-data/pannuke
    segpath_epithelial: /data/thunder-data/segpath_epithelial
    segpath_lymphocytes: /data/thunder-data/segpath_lymphocytes
    cptac_pda_os: /data/CPTAC-PDA
    leopard_bcr: /data/leopard_bcr
    pathorob: /data/pathorob
    surgen: /data/surgen
    ucla_lung: /data/ucla-lung
