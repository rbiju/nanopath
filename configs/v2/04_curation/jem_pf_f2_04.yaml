project:
  name: xarch_02_04_jem_pf_f2_04
  family: nanopath
  recipe_id: xarch_02_04_jem_pf_f2_04
  output_dir: /data/$USER/nanopath/20261109-xarch_02_04_jem_pf_f2_04
  wandb_dir: /data/$USER/nanopath/wandb

data:
  dataset_dir: /data/nanopath_parquet
  split_seed: 7777
  val_fraction: 0.05
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  global_crop_scale: [0.4, 1.0]
  local_crop_scale: [0.08, 0.35]
  rot90: true
  tissue_thresh: 0.0
  # matching jem reproduction
  independent_views: true
  color_jitter: 0.4
  color_jitter_saturation: 0.2
  grayscale: 0.2
  blur_prob: 0.5
  solarize: 0.2
  hed_jitter: 0.06
  student_augment:
    hed_jitter: 0.01
    blur_prob: 0.5
    blur_sigma: [0.1, 1.0]

model:
  type: dinov2_vits14_reg
  extra_registers: 0 # trunc-normal
  cls_tokens:
    count: 4
    decorr_weight: 0.1
  cls_specialization:
    qkv_blocks: 12
    mlp_blocks: 12
    lr_mult: null
  block_expansion: null

train:
  seed: 7777
  bf16: true
  activation_checkpointing: false
  activation_memory_budget: 0.5
  compile: true
  fused_adamw: true
  batch_size: 512
  batch_indices: /data/raymond.biju/nanopath/curation/genbio512_prog_batches.npy
  unique_slide_batches: false
  gpu_augment: true
  num_workers: 8
  prefetch_factor: 2
  persistent_workers: true
  site_balance: 0.0 # tissue-source-site balance (needs unique_slide_batches): site share ~ site_tiles^(1 - x); 0 = tile-uniform, 1 = sites as equal as one-tile-per-slide allows
  site_batches: false # every batch from one tissue source site (excludes unique_slide_batches; batches then repeat slides)
  max_train_samples: 1000000 # tile presentations; global/local crops still count as one sample
  max_train_flops: 1000000000000000000 # 1.0e18, the leaderboard FLOP budget
  log_every: 4 # 20 at batch 128; keeps the same cadence in samples
  save_every: 167 # 1000 at batch 128
  # Validation pass every `eval_every` steps over `val_batches` held-out batches
  eval_every: 33 # 200 at batch 128
  val_batches: 3 # 3072 val tiles, ~the 2048 of 16 x 128
  global_views: 8
  local_views: 0
  global_size: 224
  local_size: 112
  resume: null

dino:
  optimizer: muon
  lr: 8.5e-4
  head_lr_mult: 4.0 # LR multiplier for the DINO head + JEPA predictor (randomly initialised); backbone keeps dino.lr
  head_input: cls # what the DINO head reads: cls | patch_mean (mean of the visible output patch tokens), for student and teacher
  lr_min: 1.0e-6
  schedule_progress: samples # samples | pace: what drives every schedule (LR, WD, teacher temp, freeze, KDE, EMA); pace = legacy 0.1862 FLOP pace, so the arcs stop early
  adam_beta2: 0.996
  muon_momentum: 0.9 # Nesterov momentum of the Muon/Muown hidden-matrix updates; below 0.95 since batch 1024 already averages noise
  weight_decay: [0.04, 0.4]
  teacher_momentum: [0.99, 1.0] # teacher EMA cosine [start, end] over schedule_progress at a 128-image batch; rescaled per step for other batch sizes
  warmup_fraction: 0.08 # ~78 steps at batch 1024 (vanilla's 0.15 = ~293 steps at 512)
  freeze_last_layer_fraction: 0.05
  layerwise_decay: 1.0
  patch_embed_lr_mult: 0.0
  drop_path_rate: 0.1
  temp_scale: 1.0
  head:
    type: factored
    hidden_dim: 2048
    bottleneck_dim: 384
    prototypes: 1024
    factors: 2
    decorr_weight: 0.05
    separate_mlps: true
  balance:
    type: sinkhorn # sinkhorn | center | memax {weight} | simdino {weight}
  bias_branch:
    layer: 1
    input: patch_mean
    hidden_dim: 2048
  sacreg: {cls: 0.1, head: 0.1, bias: 0.1} # SACReg (Gaussian-fit KL to N(0, I), per dim) weights on the backbone CLS (warmup-ramped), the main-only raw head output, and the bias output; 0 = off
  clip_grad: 20.0
  kde_loss_weight: 0.005
  kde_concentration: 10.0
  kde_radius: 0.0 # chord distance on the unit sphere; CLS pairs closer than this attract, farther repel (0 = pure repulsion)
  iso_loss_weight: 0.0 # flattens the backbone CLS covariance spectrum (D / participation_ratio - 1); ramps in with LR warmup, 0 = off
  cls_inv_weight: 0.0 # MSE of each student view's layer-normed backbone CLS to the teacher's two-global mean CLS; ramps in with LR warmup, 0 = off
  # Patch prediction; `type` selects the student/teacher setup, and train.py documents each type's keys.
  jepa:
    type: window
    teacher_side: 12 # random 12x12 window of the 16x16 master crop; its tokens always keep their crop positions
    student_views: # against a 12x12 teacher, a 10x10 window always overlaps >= 6x6 = 36 and a 6x6 window >= 2x2 = 4
      - {side: 10, count: 5, mask_side: 7, min_overlap: 36, targets: 32}
      - {side: 10, count: 1, mask_side: 0, min_overlap: 36, targets: 32}
      - {side: 6, count: 2, mask_side: 4, min_overlap: 9, targets: 8}
      - {side: 6, count: 2, mask_side: 0, min_overlap: 9, targets: 8}
    masked_weight: 0.8
    dihedral: 0.0
    student_frame: true # true = each student window uses its own frame, (0, 0) at its top-left; false = master-crop positions with one window layout shared across the batch (needs dihedral 0); the teacher always keeps master-crop positions
    loss:
      type: jem
      head:
        hidden_dim: 2048
        bottleneck_dim: 256
        prototypes: 2048
        factors: 1
        separate_mlps: false
        decorr_weight: 1.0
        kde_weight: 0.0 # pure-repulsion KDE on each codebook's unit prototypes; 0 = off
        kde_concentration: 10.0 # vMF concentration of the prototype KDE; higher = repulsion only between near-duplicate prototypes
      balance:
        type: residual
        weight: 1.0
        image_weight: 0.01
        temp: 0.2

probe:
  enabled: true
  model_weights: ema
  count: 1 # 4 means probing at 25%, 50%, 75%, and 100% of the sample cap. 1 means probing just at the end.
  datasets:
    - bach
    - bracs
    - break_his
    - crc
    - esca
    - mhist
    - pcam
    - spider_breast
    - spider_colorectal
    - spider_skin
    - spider_thorax
    - wilds
  segmentation_datasets:
    - pannuke
    - segpath_epithelial
    - segpath_lymphocytes
  slide_datasets:
    - ucla_lung
  auc_datasets:
    - surgen
  survival_datasets:
    - leopard_bcr
    - cptac_pda_os
  robustness_datasets:
    - pathorob
  dataset_roots:
    bach: /data/thunder-data/bach
    bracs: /data/thunder-data/bracs
    break_his: /data/thunder-data/break_his
    crc: /data/thunder-data/crc
    esca: /data/thunder-data/esca
    mhist: /data/thunder-data/mhist
    pcam: /data/thunder-data/patch_camelyon
    spider_breast: /data/thunder-data/spider_breast
    spider_colorectal: /data/thunder-data/spider_colorectal
    spider_skin: /data/thunder-data/spider_skin
    spider_thorax: /data/thunder-data/spider_thorax
    wilds: /data/thunder-data/wilds
    pannuke: /data/thunder-data/pannuke
    segpath_epithelial: /data/thunder-data/segpath_epithelial
    segpath_lymphocytes: /data/thunder-data/segpath_lymphocytes
    cptac_pda_os: /data/CPTAC-PDA
    leopard_bcr: /data/leopard_bcr
    pathorob: /data/pathorob
    surgen: /data/surgen
    ucla_lung: /data/ucla-lung
