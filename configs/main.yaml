project:
  name: xajpf_f2_bs384_opt_visreg_mse
  family: nanopath
  recipe_id: xajpf_f2_bs384_opt_visreg_mse
  output_dir: /data/$USER/nanopath/20260828-xajpf_f2_bs384_opt_visreg_mse
  wandb_dir: /data/$USER/nanopath/wandb
data:
  dataset_dir: /data/nanopath_parquet
  split_seed: 7777
  val_fraction: 0.05
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
  global_crop_scale:
  - 0.4
  - 1.0
  local_crop_scale:
  - 0.08
  - 0.35
  color_jitter: 0.3
  color_jitter_saturation: 0.30
  hed_jitter: 0.01
  tissue_thresh: 0.0
model:
  type: dinov2_vits14_reg
  qkv_blocks: 4 # blocks (from the input side) that get a [CLS]-specialized qkv projection; LayerNorms and LayerScales are specialized in all blocks. Registers stay on the patch weights
  probe_layers: [11] # blocks whose CLS probe_features concatenates (0-based); rides in the checkpoint
train:
  seed: 12
  bf16: true
  activation_checkpointing: false
  batch_size: 384
  num_workers: 16
  prefetch_factor: 2
  persistent_workers: true
  max_train_samples: 1000000
  max_train_flops: 1_000_000_000_000_000_000
  log_every: 20
  save_every: 1000
  eval_every: 200
  val_batches: 16
  global_views: 2
  local_views: 0 # real multi-crop: 112px resampled crops, the magnification that context_regions cannot give
  context_regions: # [[side, count], ...]: `count` independent context regions of `side` patches sampled per global view
    - [12, 1]
    - [8, 2]
    - [4, 2]
  global_size: 224
  local_size: 112
  resume: null
dino:
  reg_key: sample
  lr: 0.000125
  lr_min: 1.0e-06
  lr_ref_batch_size: 128 # lr and lr_min scale linearly by batch_size / this; null disables
  adam_beta2: 0.999
  warmup_fraction: 0.0909
  freeze_last_layer_fraction: 0.0091
  layerwise_decay: 0.7
  cls_lr_mult: 1.0 # CLS-specialized (.cls.) params bypass layer-wise decay; new capacity, not pretrained features
  patch_embed_lr_mult: 0.2
  drop_path_rate: 0.1
  head_hidden_dim: 2048
  head_bottleneck_dim: 384 # split evenly across head_factors, so it must divide by it
  head_factors: 2 # codebooks the bottleneck is cut into; 1 = single-head behaviour
  head_prototypes: 768 
  prototype_reg: # keys other than `kind` are the regularizer's constructor arguments
    kind: none # none | coding_rate | swd
    weight: 0.0
    # coding_rate: eps
    # swd: projections, scale_weight, shape_weight, center_weight
  cls_vis_reg: # VISReg on a FIFO queue of CLS embeddings; keys are QueuedVISReg's constructor arguments
    weight: 0.3 # 0 disables, and the queue is not even allocated
    queue_size: 4096 # total samples the statistic sees = queue_size + batch_size
    num_projections: 128
    scale_weight: 1.0
    shape_weight: 1.0
    center_weight: 1.0
  align_from_layer: 6 # null disables; N aligns student/teacher CLS from block N to the last (0-based)
  align_weight: 0.1 # cross-view 2-2cos alignment on those CLS tokens; raw term is ~2 at zero agreement
  clip_grad: 3.0
  kde_loss_weight: 0.005  # disabled when cls_vis_reg is enabled
  kde_concentration: 10.0
  jepa_pred_depth: 4
  jepa_pred_width: 0
  jepa_targets: 48 # patches sampled without replacement from outside the context
  jepa_target_decay: 0.0 # e-folds of preference across the available depth: 0 uniform, >0 hugs the context, <0 goes deep
  jepa_target_decay_end: 0.0
  student_view_jitter: 0.02
  freeze_backbone_fraction: 0.0
probe:
  enabled: true
  model_weights: ema
  count: 1 # 4 means probing at 25%, 50%, 75%, and 100% of the sample cap. 1 means probing just at the end.
  datasets:
    - bach
    - bracs
    - break_his
    - crc
    - esca
    - mhist
    - pcam
    - spider_breast
    - spider_colorectal
    - spider_skin
    - spider_thorax
    - wilds
  segmentation_datasets:
    - pannuke
    - segpath_epithelial
    - segpath_lymphocytes
  slide_datasets:
    - ucla_lung
  auc_datasets:
    - surgen
  survival_datasets:
    - leopard_bcr
    - cptac_pda_os
  robustness_datasets:
    - pathorob
  dataset_roots:
    bach: /data/thunder-data/bach
    bracs: /data/thunder-data/bracs
    break_his: /data/thunder-data/break_his
    crc: /data/thunder-data/crc
    esca: /data/thunder-data/esca
    mhist: /data/thunder-data/mhist
    pcam: /data/thunder-data/patch_camelyon
    spider_breast: /data/thunder-data/spider_breast
    spider_colorectal: /data/thunder-data/spider_colorectal
    spider_skin: /data/thunder-data/spider_skin
    spider_thorax: /data/thunder-data/spider_thorax
    wilds: /data/thunder-data/wilds
    pannuke: /data/thunder-data/pannuke
    segpath_epithelial: /data/thunder-data/segpath_epithelial
    segpath_lymphocytes: /data/thunder-data/segpath_lymphocytes
    cptac_pda_os: /data/CPTAC-PDA
    leopard_bcr: /data/leopard_bcr
    pathorob: /data/pathorob
    surgen: /data/surgen
    ucla_lung: /data/ucla-lung
