project:
  name: xaj_lmbd_0_sInv_bs256
  family: nanopath
  recipe_id: xaj_lmbd_0_sInv_bs256
  output_dir: /data/$USER/nanopath/20260821-xaj_lmbd_0_sInv_bs256
  wandb_dir: /data/$USER/nanopath/wandb
data:
  dataset_dir: /data/nanopath_parquet
  split_seed: 7777
  val_fraction: 0.05
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
  global_crop_scale:
  - 0.4
  - 1.0
  local_crop_scale:
  - 0.08
  - 0.35
  color_jitter: 0.3
  color_jitter_saturation: 0.30
  hed_jitter: 0.07
  tissue_thresh: 0.0
model:
  type: dinov2_vits14_reg
  qkv_blocks: 4 # blocks (from the input side) that get a [CLS]-specialized qkv projection; LayerNorms and LayerScales are specialized in all blocks. Registers stay on the patch weights
train:
  seed: 12
  bf16: true
  activation_checkpointing: false
  batch_size: 256
  num_workers: 16
  prefetch_factor: 2
  persistent_workers: true
  max_train_samples: 1000000
  max_train_flops: 1_000_000_000_000_000_000
  log_every: 20
  save_every: 1000
  eval_every: 200
  val_batches: 16
  global_views: 2
  local_views: 0 # real multi-crop: 112px resampled crops, the magnification that context_regions cannot give
  context_regions: # [[side, count], ...]: `count` independent context regions of `side` patches sampled per global view
    - [12, 2]
    - [8, 2]
  global_size: 224
  local_size: 112
  resume: null
dino:
  lr: 0.000125
  lr_min: 1.0e-06
  adam_beta2: 0.999
  warmup_fraction: 0.0909
  freeze_last_layer_fraction: 0.0091
  layerwise_decay: 0.7
  cls_lr_mult: 1.0 # CLS-specialized (.cls.) params bypass layer-wise decay; new capacity, not pretrained features
  patch_embed_lr_mult: 0.2
  drop_path_rate: 0.1
  head_hidden_dim: 2048
  head_bottleneck_dim: 384
  clip_grad: 3.0
  kde_loss_weight: 0.005
  kde_concentration: 10.0
  jepa_pred_depth: 4
  jepa_pred_width: 0
  jepa_targets: 48 # patches sampled without replacement from outside the context; cap is 112 (256 - 12^2)
  jepa_target_decay: 0.0 # e-folds of preference across the available depth: 0 uniform, >0 hugs the context, <0 goes deep
  jepa_target_decay_end: 0.0
  student_view_jitter: 0.02
  freeze_backbone_fraction: 0.0
probe:
  enabled: true
  model_weights: ema
  count: 1
  datasets:
  - bracs
  - break_his
  - mhist
  - pcam
  segmentation_datasets:
  - pannuke
  - monusac
  - consep
  slide_datasets:
  - ucla_lung
  auc_datasets:
  - surgen
  survival_datasets:
  - leopard_bcr
  - cptac_pda_os
  robustness_datasets:
  - pathorob
  dataset_roots:
    bracs: /data/eva-data/bracs
    break_his: /data/eva-data/breakhis
    consep: /data/eva-data/consep
    cptac_pda_os: /data/CPTAC-PDA
    leopard_bcr: /data/leopard_bcr
    mhist: /data/eva-data/mhist
    monusac: /data/eva-data/monusac
    pcam: /data/eva-data/patch_camelyon
    pannuke: /data/thunder-data/pannuke
    pathorob: /data/pathorob
    surgen: /data/surgen
    ucla_lung: /data/ucla-lung
fino:
  enabled: true
  gamma_max: 0.7
  discrete:
  - - subtype
    - 1
  continuous:
  - - expr512
    - 1
  - - fga
    - 1
